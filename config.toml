parallel-jobs = 1
remove-rv-integrations-checks = true
debug = false

cli-source = "MorpheApp/morphe-cli"
cli-version = "latest"
patches-source = "MorpheApp/morphe-patches"
patches-version = "latest"
out-type = "apk"

[default]
cli-source = "MorpheApp/morphe-cli"
cli-args = []

# ==================== YouTube Morphe ====================
[youtube-morphe]
app-name = "com.google.android.youtube"
enabled = true
build-mode = "apk"
version = "auto"
arch = "arm64-v8a"
include-stock = false

cli-source = "MorpheApp/morphe-cli"
patches-source = "MorpheApp/morphe-patches"
integrations-source = ""

patcher-args = "-e 'GmsCore support' -f"

archive-dlurl = "https://archive.org/download/geologically/apks/com.google.android.youtube"

# ==================== X / Twitter (Morphe) ====================
[twitter-morphe]
app-name = "com.twitter.android"
enabled = true
build-mode = "apk"
version = "auto"
arch = "arm64-v8a"
include-stock = false

cli-source = "MorpheApp/morphe-cli"
patches-source = "crimera/piko"
integrations-source = ""

patcher-args = "-e 'Bring back twitter' --continue-on-error"

archive-dlurl = "https://archive.org/download/geologically/apks/com.twitter.android"
dpi = "120-640dpi"